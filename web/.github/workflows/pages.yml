name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the vendored package is importable without curses
        run: |
          if grep -q 'from xtrshow.cli import' vendor/xtrshow/repatch.py; then
            echo "::error::vendor/xtrshow/repatch.py imports from cli.py, which imports curses."
            echo "::error::Pyodide has no curses, so the demo would fail to load."
            exit 1
          fi
          python3 -c "
          import ast, sys
          for f in ('vendor/xtrshow/repatch.py', 'assets/driver.py'):
              ast.parse(open(f).read())
              print(f'{f}: parses OK')
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
